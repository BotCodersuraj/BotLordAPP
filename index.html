<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDSCU7uFxMBi5W3OQHb55rZz3_hXROZRdI",
            authDomain: "zor-battle.firebaseapp.com",
            databaseURL: "https://zor-battle-default-rtdb.firebaseio.com",
            projectId: "zor-battle",
            storageBucket: "zor-battle.firebasestorage.app",
            messagingSenderId: "305211042481",
            appId: "1:305211042481:web:6ebef4c35e2abd80bb9090",
            measurementId: "G-6MN7R2B870"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- GLOBAL BOT ENGINE (CLIENT-SIDE POLLING) ---
        // Simulates a backend server by polling Telegram directly from the browser tab.
        const botRunners = {}; 
        const botLogsCache = {}; // In-memory logs
        let activeLogListener = null;

        const pushLog = (botId, message, type = 'info') => {
            if (!botLogsCache[botId]) botLogsCache[botId] = [];
            const timestamp = new Date().toLocaleTimeString();
            botLogsCache[botId].push({ time: timestamp, message, type });
            if (botLogsCache[botId].length > 50) botLogsCache[botId].shift(); // Keep last 50
            
            // Trigger UI update if viewing this bot
            if (activeLogListener && activeLogListener.botId === botId) {
                activeLogListener.callback([...botLogsCache[botId]]);
            }
        };

        const startBotEngine = async (bot, commands) => {
            if (botRunners[bot.id]) return; // Already running
            
            botRunners[bot.id] = { active: true, offset: 0 };
            pushLog(bot.id, `🚀 Engine started for @${bot.botUsername}`, 'system');

            const poll = async () => {
                if (!botRunners[bot.id] || !botRunners[bot.id].active) return;

                try {
                    const url = `https://api.telegram.org/bot${bot.token}/getUpdates?offset=${botRunners[bot.id].offset}&timeout=5`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data.ok && data.result.length > 0) {
                        for (let update of data.result) {
                            botRunners[bot.id].offset = update.update_id + 1; // Prevent duplicate reads
                            
                            if (update.message && update.message.text) {
                                const msg = update.message;
                                pushLog(bot.id, `📥 [${msg.from.first_name}]: ${msg.text}`, 'user');
                                
                                // Process Commands
                                const cmd = commands.find(c => msg.text.startsWith(c.trigger));
                                if (cmd) {
                                    pushLog(bot.id, `⚙️ Executing command: ${cmd.trigger}`, 'system');
                                    
                                    if (cmd.mode === 'no-code') {
                                        // Send simple text reply
                                        await fetch(`https://api.telegram.org/bot${bot.token}/sendMessage`, {
                                            method: 'POST',
                                            headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify({ chat_id: msg.chat.id, text: cmd.replyText })
                                        });
                                        pushLog(bot.id, `📤 Auto-replied to ${msg.from.first_name}`, 'bot');
                                    } else if (cmd.mode === 'code') {
                                        // Execute custom JS Sandbox
                                        try {
                                            const sendMsg = async (chatId, text) => {
                                                await fetch(`https://api.telegram.org/bot${bot.token}/sendMessage`, {
                                                    method: 'POST', headers: {'Content-Type': 'application/json'},
                                                    body: JSON.stringify({ chat_id: chatId, text: text })
                                                });
                                                pushLog(bot.id, `📤 Code output sent`, 'bot');
                                            };
                                            
                                            // Secure context builder for browser
                                            const context = { msg, bot: { sendMessage: sendMsg } };
                                            const runFn = new Function('context', `return (async () => { ${cmd.jsCode} })();`);
                                            await runFn(context);
                                            pushLog(bot.id, `✅ Code execution successful`, 'success');
                                        } catch (err) {
                                            pushLog(bot.id, `❌ Code Error: ${err.message}`, 'error');
                                        }
                                    }
                                } else {
                                    pushLog(bot.id, `ℹ️ No command matched for: ${msg.text}`, 'info');
                                }
                            }
                        }
                    }
                } catch (error) {
                    pushLog(bot.id, `⚠️ Network/Polling Error: ${error.message}`, 'error');
                }

                // Loop
                if (botRunners[bot.id] && botRunners[bot.id].active) {
                    setTimeout(poll, 1000);
                }
            };

            poll(); // Start polling loop
        };

        const stopBotEngine = (botId) => {
            if (botRunners[botId]) {
                botRunners[botId].active = false;
                delete botRunners[botId];
                pushLog(botId, `🛑 Engine stopped.`, 'system');
            }
        };

        // --- 2. MAIN APPLICATION COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentTab, setCurrentTab] = useState('home');
            const [selectedBot, setSelectedBot] = useState(null);
            
            // Load global bots state to manage engines
            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('bots').where('uid', '==', user.uid).onSnapshot(async snap => {
                    const activeBots = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.status === 'active');
                    
                    // Start engines for newly active bots
                    for (let bot of activeBots) {
                        if (!botRunners[bot.id]) {
                            const cmdSnap = await db.collection('bots').doc(bot.id).collection('commands').get();
                            const commands = cmdSnap.docs.map(c => c.data());
                            startBotEngine(bot, commands);
                        }
                    }
                    
                    // Stop engines for bots no longer active
                    Object.keys(botRunners).forEach(runningId => {
                        if (!activeBots.find(b => b.id === runningId)) {
                            stopBotEngine(runningId);
                        }
                    });
                });
                return () => unsub();
            }, [user]);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex h-screen items-center justify-center text-2xl font-bold text-indigo-600 tracking-wider">BotLord<i className="fa-solid fa-spinner fa-spin ml-2"></i></div>;
            if (!user) return <AuthScreen setUser={setUser} />;

            return (
                <div className="pb-20 h-screen flex flex-col bg-slate-50 relative">
                    {/* Header */}
                    <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                        <div className="flex items-center space-x-2">
                            <div className="bg-indigo-600 text-white p-2 rounded-lg">
                                <i className="fa-solid fa-robot text-lg"></i>
                            </div>
                            <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">BotLord</h1>
                        </div>
                        <div className="flex items-center space-x-3">
                            <div className="flex items-center text-xs font-semibold bg-green-100 text-green-700 px-3 py-1.5 rounded-full">
                                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse mr-2"></div> Node Online
                            </div>
                        </div>
                    </header>

                    {/* Content */}
                    <main className="flex-1 overflow-y-auto hide-scrollbar p-4 md:px-8 max-w-4xl mx-auto w-full">
                        {currentTab === 'home' && <HomeTab user={user} setTab={setCurrentTab} />}
                        {currentTab === 'bots' && !selectedBot && <BotsTab user={user} onSelectBot={setSelectedBot} />}
                        {currentTab === 'bots' && selectedBot && <BotControlPanel bot={selectedBot} goBack={() => setSelectedBot(null)} />}
                        {currentTab === 'plus' && <AppPlusTab />}
                        {currentTab === 'profile' && <ProfileTab user={user} />}
                    </main>

                    <BottomNav currentTab={currentTab} setCurrentTab={(tab) => { setCurrentTab(tab); setSelectedBot(null); }} />
                </div>
            );
        };

        // --- 3. AUTHENTICATION --- (Unchanged structurally, styled beautifully)
        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [error, setError] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault(); setError('');
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        await db.collection('users').doc(cred.user.uid).set({
                            username, email, plan: 'free', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                } catch (err) { setError(err.message); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                    <div className="max-w-md w-full glass-panel bg-white/10 rounded-2xl shadow-2xl p-8 border border-white/20">
                        <div className="text-center mb-8">
                            <div className="bg-indigo-500 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/50">
                                <i className="fa-solid fa-bolt text-3xl text-white"></i>
                            </div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">{isLogin ? 'Welcome Back' : 'Get Started'}</h2>
                            <p className="text-indigo-200 mt-2">Deploy Telegram bots instantly.</p>
                        </div>
                        {error && <div className="bg-red-500/20 border border-red-500 text-red-100 p-3 rounded-lg mb-4 text-sm"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{error}</div>}
                        <form onSubmit={handleAuth} className="space-y-4">
                            {!isLogin && <input type="text" placeholder="Workspace Name" required className="w-full bg-slate-800/50 border border-slate-600 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" value={username} onChange={e => setUsername(e.target.value)} />}
                            <input type="email" placeholder="Email Address" required className="w-full bg-slate-800/50 border border-slate-600 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" value={email} onChange={e => setEmail(e.target.value)} />
                            <input type="password" placeholder="Password" required className="w-full bg-slate-800/50 border border-slate-600 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" value={password} onChange={e => setPassword(e.target.value)} />
                            <button type="submit" className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 px-4 rounded-xl hover:shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-95">
                                {isLogin ? 'Access Dashboard' : 'Create Workspace'}
                            </button>
                        </form>
                        <div className="mt-6 text-center text-sm">
                            <button onClick={() => setIsLogin(!isLogin)} className="text-indigo-300 hover:text-white transition">
                                {isLogin ? "Need an account? Sign up" : "Already registered? Log in"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. TABS ---

        const HomeTab = ({ user, setTab }) => {
            const [stats, setStats] = useState({ total: 0, active: 0, commands: 0 });

            useEffect(() => {
                db.collection('bots').where('uid', '==', user.uid).onSnapshot(async snap => {
                    let active = 0, cmds = 0;
                    for (const doc of snap.docs) {
                        if (doc.data().status === 'active') active++;
                        const cmdSnap = await db.collection('bots').doc(doc.id).collection('commands').get();
                        cmds += cmdSnap.size;
                    }
                    setStats({ total: snap.size, active, commands: cmds });
                });
            }, [user]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-gradient-to-br from-indigo-600 via-purple-600 to-indigo-800 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-20 -mt-20"></div>
                        <h2 className="text-3xl font-extrabold mb-2 relative z-10">Command Center</h2>
                        <p className="text-indigo-100 font-medium relative z-10">Your serverless bot engines are ready.</p>
                        <button onClick={() => setTab('bots')} className="mt-6 bg-white/20 hover:bg-white/30 backdrop-blur-sm border border-white/30 text-white px-6 py-2.5 rounded-full font-semibold transition-all relative z-10">
                            Launch Bot <i className="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>

                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
                            <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2"><i className="fa-solid fa-robot"></i></div>
                            <span className="text-2xl font-black text-slate-800">{stats.total}</span>
